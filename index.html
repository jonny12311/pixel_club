<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rift Mini</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eaf5ff;font-family:system-ui,sans-serif;overflow:hidden}#home{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#1d5270,transparent 35%),linear-gradient(135deg,#07111f,#102d3b)}.card{text-align:center;padding:48px;border:1px solid #4eb9c6;border-radius:22px;background:#091b2dcc;box-shadow:0 0 70px #1bb7b055}.logo{font-size:clamp(42px,9vw,92px);letter-spacing:8px;font-weight:900;color:#f5c84b;text-shadow:0 0 22px #e5a62c}.sub{letter-spacing:5px;color:#82e8ef;margin:8px}.play{margin-top:26px;padding:14px 38px;border:0;border-radius:9px;background:#c9922b;color:#07111f;font-weight:900;font-size:18px;cursor:pointer}.hint{margin-top:18px;color:#b6d8dc;font-size:14px}#game{display:none;min-height:100vh;align-items:center;justify-content:center;background:#06121b}#wrap{position:relative;width:min(96vw,960px)}canvas{width:100%;border:3px solid #c9922b;border-radius:12px;background:#174c38;display:block}.hud{position:absolute;top:13px;left:16px;right:16px;display:flex;justify-content:space-between;font-weight:800;text-shadow:1px 1px #000}.bar{width:190px;height:14px;background:#250b12;border:1px solid #eee;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#47d27b;width:100%}.tip{position:absolute;bottom:12px;width:100%;text-align:center;font-size:13px;color:#d1eff2}
</style></head><body>
<section id="home"><div class="card"><div class="logo">RIFT MINI</div><div class="sub">LANE BATTLE</div><button class="play" onclick="start()">게임 시작</button><div class="hint">WASD / 방향키 이동 · Space 스킬 · 적 미니언을 처치하세요</div></div></section>
<section id="game"><div id="wrap"><canvas id="c" width="960" height="540"></canvas><div class="hud"><div><div class="bar"><i id="hp"></i></div><small>소환사 체력</small></div><div>처치 <span id="score">0</span> · 남은 적 <span id="left">0</span></div></div><div class="tip">파란 미니언과 함께 붉은 진영의 넥서스를 향해 전진하세요!</div></div></section>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),K={};let p,es,bs,score,run;
onkeydown=e=>K[e.key.toLowerCase()]=1;onkeyup=e=>K[e.key.toLowerCase()]=0;
function start(){home.style.display='none';game.style.display='flex';p={x:180,y:280,h:100,cd:0};es=Array.from({length:11},(_,i)=>({x:680+i%3*68,y:130+i*33%300,h:34,s:0.3+Math.random()*.4}));bs=[];score=0;run=1;requestAnimationFrame(loop)}
function circle(a,b,r,col){x.fillStyle=col;x.beginPath();x.arc(a,b,r,0,7);x.fill()}
function drawMap(){x.fillStyle='#1c5739';x.fillRect(0,0,960,540);x.fillStyle='#786a52';x.fillRect(0,205,960,130);for(let i=0;i<960;i+=45){x.fillStyle=i%90?'#2c7144':'#3b8250';x.fillRect(i,0,20,205);x.fillRect(i,335,20,205)}x.fillStyle='#20355e';x.fillRect(60,228,54,84);x.fillStyle='#6b2531';x.fillRect(846,228,54,84);circle(87,270,28,'#50c9f5');circle(873,270,28,'#f05b5b')}
function hero(){circle(p.x,p.y,18,'#45c8ff');circle(p.x,p.y-20,7,'#f5cf75');x.fillStyle='#111';x.fillRect(p.x-22,p.y-32,44,6);x.fillStyle='#45df84';x.fillRect(p.x-22,p.y-32,44*p.h/100,6)}
function enemy(e){circle(e.x,e.y,14,'#e45158');x.fillStyle='#2b0d12';x.fillRect(e.x-17,e.y-24,34,5);x.fillStyle='#f49b55';x.fillRect(e.x-17,e.y-24,34*e.h/34,5)}
function loop(){if(!run)return;let dx=(K.a||K.arrowleft?-1:0)+(K.d||K.arrowright?1:0),dy=(K.w||K.arrowup?-1:0)+(K.s||K.arrowdown?1:0);p.x=Math.max(130,Math.min(820,p.x+dx*3.4));p.y=Math.max(90,Math.min(450,p.y+dy*3.4));if(K[' ']&&p.cd<=0){bs.push({x:p.x,y:p.y});p.cd=24}p.cd--;drawMap();for(const e of es){e.x-=e.s;if(Math.hypot(e.x-p.x,e.y-p.y)<28){p.h-=.13;e.x+=8}enemy(e)}for(const b of bs){b.x+=8;circle(b.x,b.y,6,'#f7e36c');for(const e of es)if(Math.hypot(e.x-b.x,e.y-b.y)<20)e.h-=2}es=es.filter(e=>{if(e.h<=0){score++;return false}return e.x>110});bs=bs.filter(b=>b.x<930);hero();document.querySelector('#hp').style.width=Math.max(0,p.h)+'%';scoreEl.textContent=score;left.textContent=es.length;if(p.h<=0){run=0;x.fillStyle='#07111fcc';x.fillRect(0,0,960,540);x.fillStyle='#fff';x.font='bold 48px system-ui';x.fillText('패배! 새로고침 후 재도전',210,270);return}if(!es.length){run=0;x.fillStyle='#07111faa';x.fillRect(0,0,960,540);x.fillStyle='#f5c84b';x.font='bold 52px system-ui';x.fillText('승리!',395,270);return}requestAnimationFrame(loop)}
const home=document.querySelector('#home'),game=document.querySelector('#game'),scoreEl=document.querySelector('#score');
</script></body></html>
